<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WanFeng API服务 - 首页</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="icon" href="./resources/logo.png" type="image/png" />
    <link rel="stylesheet" href="./css/welcome.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <script src="./js/jquery.js"></script>
    <script src="./js/layout.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- 首页内容区 -->
      <main id="home-content" class="page-content active">
        <section class="welcome-section">
          <div class="welcome-banner">
            <div class="welcome-icon"><i class="fas fa-cloud"></i></div>
            <h1 class="welcome-title">欢迎使用晚风API</h1>
            <p class="welcome-description">
              晚风API是小墩免费提供公益API数据接口调用服务平台-我们致力于为用户提供稳定、快速的免费API数据接口服务。
            </p>
            <a href="./api.html" class="welcome-btn"
              ><i class="fas fa-rocket"></i><span>浏览所有接口</span></a
            >
          </div>
        </section>

        <section class="stats-section">
          <h2 class="section-title">平台数据概览</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon api-icon"><i class="fas fa-plug"></i></div>
              <div class="stat-info">
                <span class="stat-number" id="total-api-count">0</span>
                <span class="stat-label">API接口</span>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon available-icon">
                <i class="fas fa-check-circle"></i>
              </div>
              <div class="stat-info">
                <span class="stat-number" id="available-api-count">0</span>
                <span class="stat-label">可用接口</span>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon today-icon">
                <i class="fas fa-calendar-day"></i>
              </div>
              <div class="stat-info">
                <span class="stat-number" id="today-call-count">0</span>
                <span class="stat-label">今日请求</span>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon total-icon">
                <i class="fas fa-chart-line"></i>
              </div>
              <div class="stat-info">
                <span class="stat-number" id="total-call-count">0</span>
                <span class="stat-label">累计请求</span>
              </div>
            </div>
          </div>
        </section>

        <section class="quick-links-section">
          <h2 class="section-title">快速入口</h2>
          <div class="quick-links-grid">
            <a href="./api.html" class="quick-link-card"
              ><i class="fas fa-list"></i><span>API列表</span></a
            >
            <a href="./vip.html" class="quick-link-card"
              ><i class="fas fa-crown"></i><span>专业会员</span></a
            >
            <a href="./admin/index.html" class="quick-link-card"
              ><i class="fas fa-user"></i><span>用户中心</span></a
            >
            <a href="./desc.html" class="quick-link-card"
              ><i class="fas fa-book"></i><span>接口文档</span></a
            >
          </div>
        </section>
      </main>
    </div>

    <script>
      $(document).ready(function () {
        // 初始化布局
        initLayout("home", "晚风 API服务");
        // 加载首页统计数据
        loadHomeStats();
      });

      // 加载首页统计数据
      function loadHomeStats() {
        $.ajax({
          url: "/api/apiInfo/getApiRoutes",
          type: "POST",
          headers: { "Content-Type": "application/json" },
          data: JSON.stringify({ summary: "", pageSize: 10, currentPage: 1 }),
          success: function (response) {
            if (response.code === 200 && response.success && response.data) {
              calculateAndDisplayStats(response.data);
            }
          }
        });
      }

      // 计算并显示统计数据
      function calculateAndDisplayStats(categories) {
        let totalApis = 0,
          availableApis = 0,
          todayCalls = 0,
          totalCalls = 0;
        categories.forEach(function (category) {
          if (category.children) {
            category.children.forEach(function (api) {
              totalApis++;
              if (api.enable !== false) availableApis++;
              todayCalls += api.today_call || 0;
              totalCalls += api.total_call || 0;
            });
          }
        });
        animateNumber("total-api-count", totalApis);
        animateNumber("available-api-count", availableApis);
        animateNumber("today-call-count", todayCalls);
        animateNumber("total-call-count", totalCalls);
      }

      // 数字动画
      function animateNumber(elementId, targetNumber) {
        const element = document.getElementById(elementId);
        if (!element) return;
        const duration = 1500,
          startTime = performance.now();
        function update(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = 1 - Math.pow(1 - progress, 3);
          element.textContent = Math.floor(
            targetNumber * easeProgress
          ).toLocaleString();
          if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
      }
    </script>
  </body>
</html>
