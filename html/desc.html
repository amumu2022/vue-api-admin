<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WanFeng API - API详情</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/desc.css" />
    <script src="./js/jquery.js"></script>
    <script src="./js/openapi.js"></script>
    <script src="./js/desc.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- 顶部导航栏 - 匹配图片 -->
      <div class="navbar">
        <div class="logo">
          <i class="fas fa-cloud"></i>
          <span>晚风 api</span>
        </div>
        <a href="#" class="github-link">
          <i class="fab fa-github"></i> GitHub
        </a>
      </div>

      <!-- API卡片区域 -->
      <div class="api-card">
        <!-- 标题区域 - 匹配图片 -->
        <div class="api-header">
          <div class="api-title">title</div>
        </div>

        <!-- 元数据区域 - 关键优化 -->
        <div class="api-meta-container">
          <div class="api-meta-grid">
            <div class="meta-item">
              <div class="meta-label"><i class="fas fa-link"></i> 接口地址</div>
              <div class="meta-content url" id="apiUrl">apiUrl</div>
            </div>

            <div class="meta-item">
              <div class="meta-label"><i class="fas fa-code"></i> 请求方法</div>
              <div class="meta-content method" id="apiMethod">POST</div>
            </div>

            <div class="meta-item">
              <div class="meta-label">
                <i class="fas fa-file-code"></i> 返回格式
              </div>
              <div class="meta-content format" id="apiFormat">JSON</div>
            </div>
          </div>
        </div>

        <!-- 参数内容区域 -->
        <div class="param-container">
          <!-- 接口描述 - 根据提供的数据 -->
          <div class="section-title">
            <i class="fas fa-info-circle"></i> 接口描述
          </div>
          <div class="description" id="apiDescription">接口描述</div>

          <!-- Query参数表格 -->
          <div class="section-title">
            <i class="fas fa-list"></i> 参数说明 (Query)
          </div>
          <table class="params-table" id="queryParamsTable">
            <thead>
              <tr>
                <th>名称</th>
                <th>必填</th>
                <th>类型</th>
                <th>默认值</th>
                <th>说明</th>
              </tr>
            </thead>
            <tbody>
              <!-- 由JS动态生成 -->
            </tbody>
          </table>

          <!-- Body参数表格 -->
          <div class="section-title">
            <i class="fas fa-list"></i> JSON参数说明 (Body)
          </div>
          <table class="params-table" id="bodyParamsTable">
            <thead>
              <tr>
                <th>名称</th>
                <th>必填</th>
                <th>类型</th>
                <th>说明</th>
              </tr>
            </thead>
            <tbody>
              <!-- 由JS动态生成 -->
            </tbody>
          </table>

          <!-- 返回参数表格 -->
          <div class="section-title">
            <i class="fas fa-list"></i> 返回参数说明
          </div>
          <table class="params-table">
            <thead>
              <tr>
                <th>名称</th>
                <th>类型</th>
                <th>说明</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

          <!-- 返回示例 -->
          <div class="section-title"><i class="fas fa-code"></i> 返回示例</div>
          <div class="no-content">暂无返回示例</div>
        </div>
      </div>

      <!-- 页脚 - 匹配图片 -->
      <div class="footer">
        <div class="copyright">京ICP备88888888号</div>
        <div class="powered-by">Powered by CC ❤ Developer is WanFeng</div>
      </div>
    </div>

    <!-- Toast通知 -->
    <div class="toast" id="toast">
      <i class="fas fa-check-circle"></i>
      <span>接口地址已复制!</span>
    </div>

    <script></script>
  </body>
</html>
