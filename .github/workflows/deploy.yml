name: Build 和 Deploy

on:
  push:
    branches: ["master"] # 触发分支

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # 新增步骤：将 dist 文件夹内容移动到 dist/admin
      - name: Move build output to admin folder
        run: |
          mkdir -p dist/admin
          mv dist/* dist/admin || true

      # 新增步骤：将 html 文件夹内容复制到 dist 根目录
      - name: Copy html files to dist
        run: |
          cp -r html/* dist/

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Zip build output
        run: zip -r dist.zip ./dist

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Release latest
          files: ./dist.zip
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
